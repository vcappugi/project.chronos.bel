<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Chronos | Gestión y Control de Tiempo</title>
  <meta name="description" content="Chronos - Plataforma de alto rendimiento para el seguimiento y gestión de tiempo y productividad.">

  <!-- Google Fonts: Plus Jakarta Sans & JetBrains Mono -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@500;700;800&family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">

  <!-- Yeti.css (Primary Framework) & Custom Styles -->
  <link rel="stylesheet" href="./css/yeti.css">
  <link rel="stylesheet" href="./css/chronos-custom.css">

  <!-- Supabase Library (Utilizada en segundo plano) -->
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
</head>
<body>

  <!-- ======================================================== -->
  <!-- 1. VISTA DE LOGIN INICIAL (MINIMALISTA)                   -->
  <!-- ======================================================== -->
  <div id="view-auth-login" class="login-wrapper">
    <div class="login-card">
      <div class="text-center mb-4">
        <!-- Logo de la aplicación desde img/cronos.jpeg -->
        <img src="./img/cronos.jpeg" alt="Logo Chronos" class="login-logo">
        <h1 class="login-brand-title">CHRONOS</h1>
        <p class="login-brand-subtitle">Control de Tiempo y Productividad</p>
      </div>

      <div id="login-error-alert" class="alert alert-danger d-none py-2 px-3 small mb-3" role="alert"></div>

      <form id="login-form" autocomplete="on">
        <div class="mb-3">
          <label for="login-username" class="form-label fw-bold small text-muted">Usuario</label>
          <input 
            type="text" 
            id="login-username" 
            class="form-control" 
            placeholder="Usuario o correo" 
            required 
            autocomplete="username"
            autofocus
          >
        </div>

        <div class="mb-4">
          <label for="login-password" class="form-label fw-bold small text-muted">Clave</label>
          <input 
            type="password" 
            id="login-password" 
            class="form-control" 
            placeholder="Contraseña" 
            required 
            autocomplete="current-password"
          >
        </div>

        <button type="submit" id="login-submit-btn" class="btn btn-primary w-100 py-2 fw-bold">
          Iniciar Sesión
        </button>
      </form>
    </div>
  </div>

  <!-- ======================================================== -->
  <!-- 2. ESPACIO DE TRABAJO PRINCIPAL (POST-AUTENTICACIÓN)      -->
  <!-- ======================================================== -->
  <div id="app-main-workspace" class="d-none">

    <!-- Navbar Minimalista Yeti -->
    <nav class="navbar navbar-expand-lg navbar-dark bg-primary shadow-sm">
      <div class="container">
        <span class="navbar-brand fw-bold d-flex align-items-center gap-2">
          <img src="./img/cronos.jpeg" alt="Logo Chronos" class="rounded" style="height: 28px; width: auto; object-fit: contain;">
          CHRONOS
        </span>

        <!-- Perfil de Usuario Minimalista -->
        <div id="user-profile-pill" class="d-flex align-items-center gap-2 text-white ms-auto">
          <span class="badge bg-secondary" id="user-role-badge">sysadmin</span>
          <span id="user-name-text" class="fw-semibold small"></span>
          <button id="sign-out-btn" class="btn btn-sm btn-outline-light ms-2" title="Cerrar Sesión">
            Salir
          </button>
        </div>
      </div>
    </nav>

    <!-- Contenedor Principal (Espacio central en blanco por ahora) -->
    <main class="container py-5" id="app-workspace-main">
      <!-- Espacio central en blanco por ahora -->
    </main>

  </div>

  <!-- Contenedor para Notificaciones Toast -->
  <div id="toast-container" class="toast-container"></div>

  <!-- Script Principal de la Aplicación -->
  <script type="module" src="./src/app.js"></script>
</body>
</html>
